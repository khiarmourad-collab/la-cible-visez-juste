<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>La cible V17</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f1ed;font-family:Arial;color:#151515}header{position:sticky;top:0;z-index:30;background:#111;color:#fff;padding:10px 12px;display:flex;justify-content:space-between;align-items:center}h1{font-size:17px;margin:0}.sub{font-size:11px;opacity:.7}button{border:0;border-radius:9px;padding:9px 11px;background:#111;color:#fff;font-weight:800}button:disabled{opacity:.35}.wrap{max-width:1000px;margin:auto;padding:10px}.scoregrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.score,.panel{background:#fff;border-radius:14px;padding:10px;margin-bottom:10px;box-shadow:0 4px 14px #0001}.big{font-size:23px;font-weight:900}.tiny{font-size:11px;color:#666}.pill{background:#eee;border-radius:999px;padding:4px 7px;font-size:11px;font-weight:800}.status{position:sticky;top:53px;z-index:20;background:#fff0b2;border:2px solid #e2c65e;border-radius:12px;padding:9px;text-align:center;font-weight:900;margin:10px 0}.title{font-weight:900;font-size:15px;margin:0 0 8px}.cards{display:flex;gap:7px;overflow-x:auto;min-height:145px;padding:2px 1px 7px}.card{position:relative;flex:0 0 96px;aspect-ratio:63/88;border:2px solid #111;border-radius:9px;background:#fff;overflow:hidden;box-shadow:0 3px 9px #0002}.card.pick{outline:4px solid #3986f6}.card.used{opacity:.28}.art{position:absolute;inset:0}.num{position:absolute;font-weight:900;font-style:italic;z-index:2}.mid{font-size:29px;left:50%;top:17%;transform:translateX(-50%)}.left{font-size:20px;left:13%;top:35%}.right{font-size:20px;right:13%;top:35%}.special{display:flex;align-items:center;justify-content:center;text-align:center;font-weight:900;padding:7px}.rows{display:grid;gap:7px}.row{display:grid;grid-template-columns:56px 1fr;gap:4px;align-items:center}.label{background:#ead8ef;border:2px solid #111;border-radius:7px;text-align:center;padding:7px 2px;font-size:10px;font-weight:900}.points{display:flex;gap:3px}.pt{position:relative;width:calc((100% - 18px)/7);height:48px;border:2px solid #111;border-radius:6px;background:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px}.pt.ok{outline:4px solid #4ab866}.pt.no{opacity:.4}.tokens{position:absolute;bottom:2px;display:flex;gap:1px}.tok{width:6px;height:6px;border:1px solid #111;border-radius:50%}.me{background:#2f7df4}.bot{background:#ef9141}.actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin-top:10px}.die{background:#eee;border-radius:9px;padding:7px;display:flex;gap:7px;align-items:center}.log{background:#111;color:#eee;border-radius:9px;padding:8px;font-size:11px;max-height:120px;overflow:auto}.fly{position:fixed;z-index:999;pointer-events:none;transition:.65s ease}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:1000;padding:18px}.modal.on{display:flex}.modalbox{background:#fff;border-radius:13px;padding:14px;width:min(360px,100%)}.modalbox button{width:100%;margin-top:6px}@media(min-width:651px){.card{flex-basis:112px}.row{grid-template-columns:78px 1fr}.pt{height:58px;font-size:22px}}</style></head><body><header><div><h1>🎯 La cible, visez juste !</h1><div class="sub">V17 — mobile + barres validées</div></div><button id="restart">Nouvelle partie</button></header><div class="wrap"><div class="scoregrid"><div class="score"><span class="pill">🔵 Vous</span><div class="big"><span id="sh">0</span> pts</div><div class="tiny"><span id="ch">0</span> cartes · <span id="th">5</span> jetons</div></div><div class="score"><span class="pill">🟠 Bot</span><div class="big"><span id="sb">0</span> pts</div><div class="tiny"><span id="cb">0</span> cartes · <span id="tb">5</span> jetons</div></div></div><div id="status" class="status">Initialisation…</div><section class="panel"><h2 class="title">Votre main</h2><div id="hand" class="cards"></div></section><section class="panel"><h2 class="title">Rivière — cartes cible</h2><div id="market" class="cards"></div></section><section class="panel"><h2 class="title">Cartes point</h2><div class="rows"><div class="row"><div class="label">Simple</div><div id="simple" class="points"></div></div><div class="row"><div class="label">Double</div><div id="double" class="points"></div></div><div class="row"><div class="label">Triple</div><div id="triple" class="points"></div></div></div><div class="actions"><div class="die">🎲 <b id="die">–</b> <button id="roll">Lancer</button></div><button id="finish">Terminer mon tour</button></div></section><section class="panel"><h2 class="title">Journal</h2><div id="log" class="log"></div></section></div><div id="modal" class="modal"><div class="modalbox"><b id="mtitle"></b><div id="mchoices"></div></div></div><script>const $=s=>document.querySelector(s),shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a},sum=a=>a.reduce((x,y)=>x+y,0),wait=m=>new Promise(r=>setTimeout(r,m));const data=[[5,12,20,'round'],[18,1,4,'round'],[20,5,1,'round'],[19,3,7,'round'],[1,20,18,'round'],[3,17,19,'round'],[25,null,null,'round'],[8,16,11,'straight'],[17,2,3,'straight'],[13,4,6,'straight'],[16,7,8,'straight'],[6,13,10,'straight'],[7,19,16,'straight'],[4,18,13,'straight'],[14,11,9,'point'],[10,6,15,'point'],[9,14,12,'point'],[12,9,5,'point'],[15,10,2,'point'],[2,15,17,'point'],[11,8,14,'point'],[25,null,null,'point']];const specials=[{id:'miss',type:'miss'},{id:'choice',type:'choice'},{id:'ex1',type:'extra',values:[5,20,12,9,14,11,8]},{id:'ex2',type:'extra',values:[7,16,19,3,17,2,15]},{id:'ex3',type:'extra',values:[10,25,6,13,4,18,1]}];const targets=data.map((x,i)=>({id:'c'+i,mid:x[0],left:x[1],right:x[2],shape:x[3]}));let G;function art(shape){let p=shape==='round'?'<path d="M12 18 Q48 2 84 18 L84 30 Q48 18 12 30 Z"/>':shape==='point'?'<path d="M12 18 L48 31 L84 18 L84 30 L48 43 L12 30 Z"/>':'<path d="M12 18 H84 V30 H12 Z"/>';return `<svg viewBox="0 0 96 134" xmlns="http://www.w3.org/2000/svg"><rect width="96" height="134" fill="white"/>${p}<g stroke="#111" fill="none" stroke-width="1.5"><path d="M18 48 L48 112 L78 48"/><path d="M30 48 L48 112 L66 48"/><path d="M42 48 L48 112 L54 48"/><circle cx="48" cy="112" r="4" fill="#111"/></g></svg>`}function vals(c){if(c.type==='miss')return[];if(c.type==='choice')return Array.from({length:25},(_,i)=>i+1);if(c.type==='extra')return c.values;return[c.mid,c.left,c.right].filter(v=>v!=null)}function desc(c){return c.type==='miss'?'Manquée':c.type==='choice'?'Valeur au choix':c.type==='extra'?'Extra':'cible '+c.mid}function log(t){$('#log').innerHTML+='• '+t+'<br>';$('#log').scrollTop=$('#log').scrollHeight}function card(c,st=''){let d=document.createElement('div');d.className='card '+st;d.dataset.id=c.id;if(c.type){d.classList.add('special');d.innerHTML=c.type==='miss'?'✖<br>MANQUÉE':c.type==='choice'?'?<br>VALEUR AU CHOIX':'<div><b>EXTRA</b><br><small>'+c.values.join(' · ')+'</small></div>';return d}d.innerHTML='<div class="art">'+art(c.shape)+'</div><div class="num mid">'+c.mid+'</div>'+(c.left!=null?'<div class="num left">'+c.left+'</div><div class="num right">'+c.right+'</div>':'');return d}function fill(){while(G.market.length<4&&G.deck.length)G.market.push(G.deck.shift())}function newGame(){let p=shuffle([...Array(20)].map((_,i)=>i+1).concat(25));G={deck:shuffle(targets.concat(specials)),market:[],rows:{simple:p.slice(0,7),double:p.slice(7,14),triple:p.slice(14)},tt:{},H:{hand:[],used:new Set(),pts:[],tokens:5},B:{hand:[],used:new Set(),pts:[],tokens:5},phase:'pick',turn:'H',first:'H',picks:{H:0,B:0},die:null,rolled:false,lock:false};fill();$('#log').innerHTML='';log('Nouvelle partie : vous commencez.');render()}function possible(m,v,w){let P=G[w],a=P.hand.filter(c=>!P.used.has(c.id)&&vals(c).includes(v));if(m==='simple')return a.length>0;if(m==='double')return a.length>=2||(G.rolled&&G.die===2&&a.some(c=>!c.type&&c.mid===v));if(m==='triple')return a.length>0&&P.tokens>0}function any(w){return['simple','double','triple'].some(m=>G.rows[m].some(v=>possible(m,v,w)))}function render(){sh.textContent=sum(G.H.pts);sb.textContent=sum(G.B.pts);ch.textContent=G.H.pts.length;cb.textContent=G.B.pts.length;th.textContent=G.H.tokens;tb.textContent=G.B.tokens;die.textContent=G.die??'–';hand.innerHTML='';G.H.hand.forEach(c=>hand.appendChild(card(c,G.H.used.has(c.id)?'used':'')));market.innerHTML='';G.market.forEach((c,i)=>{let d=card(c,G.phase==='pick'&&G.turn==='H'&&!G.lock?'pick':'');if(d.classList.contains('pick'))d.onclick=()=>pickH(i,d);market.appendChild(d)});['simple','double','triple'].forEach(m=>{let b=$('#'+m);b.innerHTML='';G.rows[m].forEach(v=>{let d=document.createElement('div'),ok=G.phase==='play'&&G.turn==='H'&&possible(m,v,'H');d.className='pt '+(ok?'ok':'no');d.textContent=v;if(m==='triple'){let t=G.tt[v]||{H:0,B:0},x=document.createElement('div');x.className='tokens';x.innerHTML='<i class="tok me"></i>'.repeat(t.H)+'<i class="tok bot"></i>'.repeat(t.B);d.appendChild(x)}if(ok)d.onclick=()=>playH(m,v);b.appendChild(d)})});roll.disabled=!(G.phase==='play'&&G.turn==='H'&&!G.rolled);finish.disabled=!(G.phase==='play'&&G.turn==='H'&&!any('H'));status.textContent=G.phase==='pick'?(G.turn==='H'?`Phase 1 — choisissez une carte (${G.picks.H}/3).`:'Phase 1 — le bot choisit…'):(G.turn==='H'?(any('H')?'Phase 2 — jouez une carte point entourée en vert.':'Phase 2 — plus aucun coup : terminez votre tour.'):'Phase 2 — le bot joue…')}async function fly(el,bot){let r=el.getBoundingClientRect(),c=el.cloneNode(true);c.classList.add('fly');Object.assign(c.style,{left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px'});document.body.appendChild(c);await wait(20);if(bot){c.style.top='-150px';c.style.left=(innerWidth/2)+'px'}else{let h=hand.getBoundingClientRect();c.style.left=h.left+'px';c.style.top=h.top+'px'}c.style.opacity=.1;c.style.transform='scale(.7)';await wait(650);c.remove()}async function pickH(i,el){if(G.lock)return;G.lock=true;await fly(el,false);let c=G.market.splice(i,1)[0];G.H.hand.push(c);G.picks.H++;fill();log('Vous prenez '+desc(c)+'.');if(G.picks.H>=3&&G.picks.B>=3){G.lock=false;return startPlay()}G.turn='B';G.lock=false;render();setTimeout(pickB,350)}async function pickB(){G.lock=true;await wait(250);let i=Math.floor(Math.random()*G.market.length),el=market.children[i];if(el)await fly(el,true);let c=G.market.splice(i,1)[0];G.B.hand.push(c);G.picks.B++;fill();log('Le bot prend une carte.');G.lock=false;if(G.picks.H>=3&&G.picks.B>=3)return startPlay();G.turn='H';render()}function startPlay(){G.phase='play';G.die=null;G.rolled=false;G.turn=G.H.hand.some(c=>c.type==='miss')?'H':G.B.hand.some(c=>c.type==='miss')?'B':G.first;log('Phase 2.');render();if(G.turn==='B')setTimeout(botPlay,350)}function match(w,v){return G[w].hand.filter(c=>!G[w].used.has(c.id)&&vals(c).includes(v))}function take(w,m,v){let a=G.rows[m],i=a.indexOf(v);if(i<0)return;a.splice(i,1);G[w].pts.push(v);log((w==='H'?'Vous récupérez ':'Le bot récupère ')+v+' en '+m+'.')}function playH(m,v){let a=match('H',v);if(m==='simple'){G.H.used.add(a[0].id);take('H',m,v)}else if(m==='double'){if(a.length>=2){G.H.used.add(a[0].id);G.H.used.add(a[1].id);take('H',m,v)}else if(G.rolled&&G.die===2){G.H.used.add(a[0].id);take('H',m,v)}}else{G.H.used.add(a[0].id);let t=G.tt[v]||{H:0,B:0},n=Math.min(G.rolled?G.die:1,G.H.tokens,3-t.H);t.H+=n;G.H.tokens-=n;G.tt[v]=t;log('Vous posez '+n+' jeton(s) sur '+v+'.');if(t.H>=3)take('H',m,v)}render()}roll.onclick=()=>{G.die=1+Math.floor(Math.random()*3);G.rolled=true;log('Dé : '+G.die+'.');render()};finish.onclick=()=>{if(any('H'))return;G.turn='B';render();setTimeout(botPlay,350)};function botPlay(){G.die=1+Math.floor(Math.random()*3);G.rolled=true;let guard=0;while(any('B')&&guard++<20){let opts=[];['simple','double','triple'].forEach(m=>G.rows[m].forEach(v=>{if(possible(m,v,'B'))opts.push({m,v})}));let o=opts.sort((a,b)=>b.v-a.v)[0],a=match('B',o.v);if(o.m==='simple'){G.B.used.add(a[0].id);take('B',o.m,o.v)}else if(o.m==='double'){if(a.length>=2){G.B.used.add(a[0].id);G.B.used.add(a[1].id);take('B',o.m,o.v)}else{G.B.used.add(a[0].id);take('B',o.m,o.v)}}else{G.B.used.add(a[0].id);let t=G.tt[o.v]||{H:0,B:0},n=Math.min(G.die,G.B.tokens,3-t.B);t.B+=n;G.B.tokens-=n;G.tt[o.v]=t;if(t.B>=3)take('B',o.m,o.v)}}endRound()}function endRound(){G.first=G.first==='H'?'B':'H';G.H.hand=[];G.B.hand=[];G.H.used=new Set();G.B.used=new Set();G.picks={H:0,B:0};G.phase='pick';G.turn=G.first;G.die=null;G.rolled=false;log('Nouveau tour.');render();if(G.turn==='B')setTimeout(pickB,350)}restart.onclick=newGame;newGame();</script></body></html>
