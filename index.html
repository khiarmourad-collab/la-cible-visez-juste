<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>La cible, visez juste !</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f2ee;font-family:Arial;color:#171717}header{position:sticky;top:0;z-index:30;background:#151515;color:#fff;padding:12px;display:flex;justify-content:space-between;align-items:center}h1{font-size:18px;margin:0}button{border:0;border-radius:10px;padding:10px 12px;font-weight:800;background:#171717;color:#fff}.wrap{padding:8px;max-width:1050px;margin:auto}.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}.p{background:#fff;border-radius:16px;padding:9px;margin-bottom:8px;box-shadow:0 5px 18px #0001}.score{display:flex;justify-content:space-between}.big{font-size:22px;font-weight:900}.tiny{font-size:10px;color:#666}.pill{background:#eee;padding:5px 8px;border-radius:999px;font-size:12px;font-weight:800}.status{position:sticky;top:57px;z-index:20;background:#fff1bd;border:2px solid #e8c959;border-radius:14px;padding:10px;font-weight:900;margin-bottom:8px}.title{font-size:16px;margin:0 0 8px}.cards,.hand{display:flex;gap:6px;overflow-x:auto}.slot{flex:1;min-width:0;aspect-ratio:63/88;border:3px dashed #aaa;border-radius:7px;position:relative}.slot.f{border-color:transparent}.slot .card{position:absolute;inset:0;width:100%;height:100%}.card{flex:0 0 96px;width:96px;aspect-ratio:63/88;border:4px solid #171717;border-radius:6px;background:#fff;overflow:hidden;position:relative;box-shadow:0 3px 9px #0002}.card.off{opacity:.42}.symz{height:34%;border-bottom:3px solid #171717;display:flex;align-items:center;justify-content:center}.sym{width:25px;height:25px}.circle{border-radius:50%}.square{border-radius:2px}.red{background:#f33;color:#f33}.blue{background:#22d;color:#22d}.orange{background:#f95;color:#f95}.triangle{width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-bottom:25px solid currentColor;background:none!important}.body{height:66%;position:relative}.mid{position:absolute;left:50%;top:8px;transform:translateX(-50%);font-size:31px;font-weight:900;font-style:italic}.side{position:absolute;left:4px;right:4px;top:22px;display:flex;justify-content:space-between;font-size:16px;font-weight:900;font-style:italic}.die{position:absolute;left:0;right:0;top:53px;text-align:center;font-size:14px}.special{height:100%;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:900;font-size:16px}.extras{display:grid;grid-template-columns:1fr 1fr;font-size:14px;font-weight:900;text-align:center;padding:4px}.rows{display:grid;gap:7px}.row{display:grid;grid-template-columns:58px 1fr;gap:4px;align-items:center}.lab{background:#c56ad8;border:3px solid #171717;border-radius:6px;padding:7px 2px;text-align:center;font-size:10px;font-weight:900}.pts{display:flex;gap:3px}.pt{min-width:0;width:calc((100% - 18px)/7);height:48px;border:3px solid #aaa;border-radius:6px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:900;font-style:italic;position:relative}.pt.ok{border-color:#171717;outline:3px solid #54b96c}.tok{width:6px;height:6px;border-radius:50%;display:inline-block}.me{background:#2f7df4}.bo{background:#f59b45}.tokens{position:absolute;bottom:2px;display:flex;gap:1px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}.log{background:#151515;color:#eee;border-radius:10px;padding:8px;max-height:140px;overflow:auto;font-size:11px}.fly{position:fixed;z-index:999;pointer-events:none;transition:all 1.35s cubic-bezier(.2,.8,.2,1)}@media(min-width:651px){.card{flex-basis:128px;width:128px}.slot{flex:0 0 128px;width:128px}.hand{overflow:visible}.mid{font-size:38px}.side{font-size:24px;top:35px}.die{top:76px}}</style></head><body><header><div><h1>🎯 La cible, visez juste !</h1><div style="font-size:12px;opacity:.7">Version en ligne — test</div></div><button id="restart">Nouvelle partie</button></header><div class="wrap"><div class="grid"><section class="p"><div class="score"><div><span class="pill">🔵 Vous</span><div class="big"><span id="sh">0</span> pts</div><div class="tiny"><span id="ch">0</span> cartes · <span id="th">5</span> jetons</div></div><span id="fh" class="pill"></span></div></section><section class="p"><div class="score"><div><span class="pill">🟠 Bot</span><div class="big"><span id="sb">0</span> pts</div><div class="tiny"><span id="cb">0</span> cartes · <span id="tb">5</span> jetons</div></div><span id="fb" class="pill"></span></div></section></div><div id="status" class="status"></div><section class="p"><h2 class="title">Votre main — cartes cibles</h2><div id="hand" class="hand"></div></section><section class="p"><h2 class="title">Rivière — cartes cibles</h2><div id="market" class="cards"></div></section><section class="p"><h2 class="title">Cartes points</h2><div class="rows"><div class="row"><div class="lab">Mode<br>simple</div><div id="simple" class="pts"></div></div><div class="row"><div class="lab">Mode<br>double</div><div id="double" class="pts"></div></div><div class="row"><div class="lab">Mode<br>triple</div><div id="triple" class="pts"></div></div></div><div class="actions"><button id="roll" style="display:none">🎲 Lancer le dé</button><span id="dr" class="pill" style="display:none"></span><button id="finish" style="display:none;background:#ddd;color:#111">Terminer mon tour</button></div></section><section class="p"><h2 class="title">Journal</h2><div id="log" class="log"></div></section></div><script>const C=[[5,12,20,'circle','orange'],[18,1,4,'circle','red'],[20,5,1,'circle','blue'],[19,3,7,'circle','red'],[1,20,18,'circle','orange'],[3,17,19,'circle','orange'],[8,16,11,'square','red'],[14,11,9,'triangle','orange'],[10,6,15,'triangle','blue'],[9,14,12,'triangle','red'],[12,9,5,'triangle','blue'],[17,2,3,'square','blue'],[13,4,6,'square','orange'],[16,7,8,'square','orange'],[15,10,2,'triangle','orange'],[6,13,10,'square','red'],[7,19,16,'square','blue'],[4,18,13,'square','blue'],[2,15,17,'triangle','red'],[11,8,14,'triangle','blue']].map((a,i)=>({id:'c'+i,t:'c',m:a[0],l:a[1],r:a[2],s:a[3],co:a[4]}));const S=[{id:'25a',t:'25',s:'circle',co:'red'},{id:'25b',t:'25',s:'triangle',co:'orange'},{id:'miss',t:'miss',s:'square',co:'red'},{id:'choice',t:'choice',s:'circle',co:'blue'},{id:'x1',t:'x',v:[5,20,12,9,14,11,8],s:'square',co:'orange'},{id:'x2',t:'x',v:[7,16,19,3,17,2,15],s:'circle',co:'blue'},{id:'x3',t:'x',v:[10,25,6,13,4,18,1],s:'triangle',co:'red'}];let G;const $=x=>document.getElementById(x),mix=a=>{a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a},sum=a=>a.reduce((x,y)=>x+y,0),vals=c=>c.t==='c'?[c.l,c.m,c.r]:c.t==='25'?[25]:c.t==='x'?c.v:c.t==='choice'?[...Array(25)].map((_,i)=>i+1):[],dv=c=>c.t==='c'?c.m:c.t==='25'?25:null,wait=n=>new Promise(r=>setTimeout(r,n));function log(t){$('log').innerHTML+='• '+t+'<br>';$('log').scrollTop=$('log').scrollHeight}function card(c,off=''){let z=`<div class="sym ${c.s} ${c.co}"></div>`,b='';if(c.t==='c')b=`<div class="mid">${c.m}</div><div class="side"><span>${c.l}</span><span>${c.r}</span></div><div class="die">🎲</div>`;else if(c.t==='25')b='<div class="mid">25</div><div class="die">🎲</div>';else if(c.t==='miss')b='<div class="special">Manquée</div>';else if(c.t==='choice')b='<div class="special">Valeur<br>au choix</div>';else b='<div class="extras">'+c.v.map(v=>`<span>${v}</span>`).join('')+'</div>';return `<div class="card ${off}" data-id="${c.id}"><div class="symz">${z}</div><div class="body">${b}</div></div>`}function fill(){while(G.mk.length<4&&G.deck.length)G.mk.push(G.deck.shift())}function fresh(){let p=mix([...Array(20)].map((_,i)=>i+1).concat(25));G={deck:mix([...C,...S]),mk:[],row:{simple:p.slice(0,7),double:p.slice(7,14),triple:p.slice(14)},tt:{},H:{h:[],u:new Set,pts:[],tok:5},B:{h:[],u:new Set,pts:[],tok:5},ph:'pick',turn:'H',first:'H',pk:{H:0,B:0},done:{H:false,B:false},die:null,over:false};fill();$('log').innerHTML='';log('Nouvelle partie : vous êtes Premier joueur.');render()}function direct(w,v){return G[w].h.filter(c=>!G[w].u.has(c.id)&&vals(c).includes(v))}function dcard(w,v){return G[w].h.filter(c=>!G[w].u.has(c.id)&&dv(c)===v)}function poss(m,v,w='H'){let a=direct(w,v),d=w==='H'?G.die:null,P=G[w];if(m==='simple')return a.length&&G.row.simple[0]===v;if(m==='double')return a.length>=2||(d===2&&dcard(w,v).length);let t=G.tt[v]||{H:0,B:0},need=3-t[w];return(a.length&&P.tok>0)||(d&&dcard(w,v).length&&P.tok>=d&&d<=need)}function any(w){return['simple','double','triple'].some(m=>G.row[m].some(v=>poss(m,v,w)))}function render(){$('sh').textContent=sum(G.H.pts);$('sb').textContent=sum(G.B.pts);$('ch').textContent=G.H.pts.length;$('cb').textContent=G.B.pts.length;$('th').textContent=G.H.tok;$('tb').textContent=G.B.tok;$('fh').textContent=G.first==='H'?'⭐ Premier':'';$('fb').textContent=G.first==='B'?'⭐ Premier':'';let pick=G.ph==='pick'&&G.turn==='H';$('market').innerHTML=G.mk.map(c=>card(c,pick?'':'off')).join('');if(pick)document.querySelectorAll('#market .card').forEach(e=>e.onclick=()=>hpick(e.dataset.id));$('hand').innerHTML=[0,1,2].map(i=>`<div class="slot ${G.H.h[i]?'f':''}" data-slot="${i}">${G.H.h[i]?card(G.H.h[i],G.H.u.has(G.H.h[i].id)?'off':''):''}</div>`).join('');['simple','double','triple'].forEach(m=>{$(m).innerHTML=G.row[m].map(v=>{let ok=G.ph==='play'&&G.turn==='H'&&poss(m,v),t=G.tt[v]||{H:0,B:0};return `<div class="pt ${ok?'ok':''}" data-m="${m}" data-v="${v}">${v}${m==='triple'?`<div class="tokens">${'<i class="tok me"></i>'.repeat(t.H)}${'<i class="tok bo"></i>'.repeat(t.B)}</div>`:''}</div>`}).join('')});if(G.ph==='play'&&G.turn==='H')document.querySelectorAll('.pt.ok').forEach(e=>e.onclick=()=>play(e.dataset.m,+e.dataset.v));$('roll').style.display=G.ph==='play'&&G.turn==='H'?'inline-block':'none';$('finish').style.display=G.ph==='play'&&G.turn==='H'?'inline-block':'none';$('dr').style.display=G.die!=null&&G.ph==='play'&&G.turn==='H'?'inline-block':'none';$('dr').textContent=G.die!=null?'Résultat : '+G.die:'';$('finish').disabled=G.ph==='play'&&G.turn==='H'&&any('H');$('status').textContent=G.ph==='pick'?(G.turn==='H'?'Choisissez une carte cible':'Le bot choisit une carte cible…'):G.ph==='trans'?'Phase 1 terminée — passage à la phase 2…':G.turn==='H'?'Phase 2 — jouez vos cartes cibles pour récupérer des cartes points.':'Phase 2 — le bot joue…'}async function fly(src,idx,bot){let r=src.getBoundingClientRect(),x=src.cloneNode(true);x.classList.add('fly');Object.assign(x.style,{left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px'});document.body.appendChild(x);await wait(20);if(bot){x.style.top='-160px';x.style.opacity='.1'}else{let q=document.querySelector(`[data-slot="${idx}"]`),t=q.getBoundingClientRect();x.style.left=t.left+'px';x.style.top=t.top+'px';x.style.width=t.width+'px';x.style.height=t.height+'px';x.style.opacity='.2'}await wait(1380);x.remove()}async function hpick(id){if(G.turn!=='H')return;let i=G.mk.findIndex(c=>c.id===id),src=document.querySelector(`[data-id="${id}"]`),idx=G.H.h.length;G.turn='L';await fly(src,idx,false);G.H.h.push(G.mk.splice(i,1)[0]);G.pk.H++;fill();if(G.pk.H===3&&G.pk.B===3)return start();G.turn='B';render();setTimeout(bpick,550)}async function bpick(){let c=G.mk[0],i=0,src=document.querySelector(`[data-id="${c.id}"]`);G.turn='L';await fly(src,0,true);G.B.h.push(G.mk.splice(i,1)[0]);G.pk.B++;fill();if(G.pk.H===3&&G.pk.B===3)return start();G.turn='H';render()}function start(){G.ph='trans';G.turn='L';render();setTimeout(()=>{G.ph='play';G.done={H:false,B:false};G.die=null;G.turn=G.H.h.some(c=>c.t==='miss')?'H':G.B.h.some(c=>c.t==='miss')?'B':G.first;render();if(G.turn==='B')setTimeout(bplay,450)},900)}function take(w,m,v){G.row[m].splice(G.row[m].indexOf(v),1);G[w].pts.push(v);log((w==='H'?'Vous récupérez ':'Le bot récupère ')+v+' en mode '+m+'.')}function play(m,v){let a=direct('H',v),d=dcard('H',v);if(m==='simple'){G.H.u.add(a[0].id);take('H',m,v)}else if(m==='double'){if(G.die===2&&d.length&&a.length<2){G.H.u.add(d[0].id);G.die=null}else{G.H.u.add(a[0].id);G.H.u.add(a[1].id)}take('H',m,v)}else{let t=G.tt[v]||{H:0,B:0},need=3-t.H;if(G.die&&d.length&&G.die<=need){let n=G.die;G.H.u.add(d[0].id);t.H+=n;G.H.tok-=n;G.die=null}else{G.H.u.add(a[0].id);t.H++;G.H.tok--}G.tt[v]=t;if(t.H>=3){take('H',m,v);G.H.tok+=t.H;G.B.tok+=t.B;delete G.tt[v]}}render();if(!any('H'))next('H')}function next(w){G.done[w]=true;G.die=null;let o=w==='H'?'B':'H';if(!G.done[o]){G.turn=o;render();if(o==='B')setTimeout(bplay,400)}else round()}function bplay(){while(any('B')){let o=[];['simple','double','triple'].forEach(m=>G.row[m].forEach(v=>{if(poss(m,v,'B'))o.push({m,v})}));let q=o.sort((a,b)=>b.v-a.v)[0],a=direct('B',q.v);if(q.m==='simple'){G.B.u.add(a[0].id);take('B',q.m,q.v)}else if(q.m==='double'){G.B.u.add(a[0].id);G.B.u.add(a[1].id);take('B',q.m,q.v)}else{G.B.u.add(a[0].id);let t=G.tt[q.v]||{H:0,B:0};t.B++;G.B.tok--;G.tt[q.v]=t;if(t.B>=3){take('B',q.m,q.v);G.H.tok+=t.H;G.B.tok+=t.B;delete G.tt[q.v]}}}next('B')}function round(){let left=G.row.simple.length+G.row.double.length+G.row.triple.length;if(left<=7)return end();let i=G.mk.findIndex(c=>c.t==='miss');if(i>=0){G.mk.splice(i,1);fill();log('Personne n’a pris la carte Manquée : elle est défaussée.')}G.first=G.first==='H'?'B':'H';G.H.h=[];G.B.h=[];G.H.u=new Set;G.B.u=new Set;G.pk={H:0,B:0};G.done={H:false,B:false};G.ph='pick';G.turn=G.first;log('Le pion Premier joueur passe au joueur suivant.');render();if(G.turn==='B')setTimeout(bpick,450)}function end(){G.over=true;$('status').textContent='Partie terminée.'}$('roll').onclick=()=>{if(G.ph!=='play'||G.turn!=='H')return;let f=[1,1,1,2,2,3];G.die=f[Math.floor(Math.random()*f.length)];log('Vous lancez le dé : '+G.die+'.');render()};$('finish').onclick=()=>{if(!any('H'))next('H')};$('restart').onclick=fresh;fresh();</script></body></html>
