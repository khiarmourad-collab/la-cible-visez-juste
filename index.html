<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>La cible, visez juste !</title><style>:root{--bg:#f4f2ee;--ink:#171717;--violet:#c56ad8;--blue:#2f7df4;--orange:#f59b45}*{box-sizing:border-box}body{margin:0;font-family:Arial;background:var(--bg);color:var(--ink)}header{position:sticky;top:0;z-index:20;background:#151515;color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center}h1{font-size:18px;margin:0}.sub{font-size:12px;opacity:.75}button{border:0;border-radius:10px;padding:10px 13px;font-weight:800;background:#171717;color:#fff}button.light{background:#ececec;color:#111}.wrap{max-width:1100px;margin:auto;padding:14px}.status{background:#fff1bd;border:2px solid #e8c959;border-radius:14px;padding:11px 13px;font-weight:800;margin-bottom:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.panel{background:#fff;border-radius:16px;padding:13px;box-shadow:0 7px 24px #0002;margin-bottom:13px}.score{display:flex;justify-content:space-between}.pill{padding:5px 9px;border-radius:999px;background:#eee;font-weight:800;font-size:13px}.big{font-size:28px;font-weight:900}.tiny{font-size:12px;color:#666}.title{font-weight:900;margin:0 0 9px;font-size:16px}.cards{display:flex;gap:9px;flex-wrap:wrap}.hand-slots{display:flex;gap:9px;flex-wrap:nowrap}.hand-slot{width:128px;height:178px;border:3px dashed #aaa;border-radius:7px;background:#fafafa;position:relative;flex:0 0 128px}.hand-slot.filled{border-color:transparent;background:transparent}.hand-slot .target{position:absolute;inset:0;width:100%;height:100%}.target{width:128px;height:178px;border:4px solid #171717;border-radius:5px;background:#fff;overflow:hidden;cursor:pointer;box-shadow:0 4px 11px #0002}.target.off{opacity:.4;cursor:default}.target.used{opacity:.25}.symzone{height:42px;border-bottom:3px solid #171717;display:flex;align-items:center;justify-content:center}.sym{width:25px;height:25px}.circle{border-radius:50%}.square{border-radius:2px}.red{background:#ff3232;color:#ff3232}.blue{background:#1717dc;color:#1717dc}.orange{background:#ff9651;color:#ff9651}.triangle{width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-bottom:25px solid currentColor;background:none!important}.body{height:132px;padding:7px}.mainv{text-align:center;font-size:37px;font-weight:900;font-style:italic}.dice{text-align:center}.sides{display:flex;justify-content:space-between;font-size:26px;font-weight:900;font-style:italic;margin-top:17px}.special{height:118px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:22px;font-weight:900}.extras{display:grid;grid-template-columns:1fr 1fr;font-size:22px;font-weight:900;text-align:center}.extras span:last-child:nth-child(odd){grid-column:1/3}.rows{display:grid;gap:9px}.row{display:grid;grid-template-columns:100px 1fr;gap:8px;align-items:center}.label{background:var(--violet);border:3px solid #171717;border-radius:5px;padding:10px 5px;text-align:center;font-weight:900}.points{display:flex;gap:7px}.point{min-width:64px;height:66px;border:3px solid #171717;border-radius:5px;background:#fff;font-size:27px;font-weight:900;font-style:italic;display:flex;align-items:center;justify-content:center;position:relative}.point.no{opacity:.38}.point.ok{outline:4px solid #51b66b;cursor:pointer}.tokens{position:absolute;bottom:2px;display:flex;gap:2px}.tok{width:9px;height:9px;border-radius:50%;border:1px solid #111}.me{background:var(--blue)}.bot{background:var(--orange)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.log{background:#151515;color:#eee;border-radius:10px;padding:9px;max-height:170px;overflow:auto;font-size:12px}.fly{position:fixed;z-index:9999;pointer-events:none;transition:left 1.35s cubic-bezier(.2,.8,.2,1),top 1.35s cubic-bezier(.2,.8,.2,1),transform 1.35s ease,opacity 1.35s ease}@media(max-width:650px){.wrap{padding:8px}.hand-slots{gap:6px}.hand-slot{flex:1;width:auto;height:auto;aspect-ratio:63/88}.grid2{gap:6px}.panel{padding:9px;margin-bottom:8px}.big{font-size:21px}.tiny{font-size:10px}.cards{gap:6px;flex-wrap:nowrap;overflow-x:auto}.target{flex:0 0 96px;width:96px;height:auto;aspect-ratio:63/88}.row{grid-template-columns:58px 1fr;gap:4px}.label{font-size:10px;padding:7px 2px}.points{gap:3px}.point{min-width:0;width:calc((100% - 18px)/7);height:48px;font-size:18px}.tok{width:6px;height:6px}.status{position:sticky;top:58px;z-index:19}}</style></head><body><header><div><h1>🎯 La cible, visez juste !</h1><div class="sub">Version test — corrections 1 à 5</div></div><button id="restart">Nouvelle partie</button></header><div class="wrap"><div class="grid2"><section class="panel"><div class="score"><div><span class="pill">🔵 Vous</span><div class="big"><span id="scoreH">0</span> pts</div><div class="tiny"><span id="cardsH">0</span> cartes points · <span id="tokensH">5</span> jetons</div></div><span id="firstH" class="pill"></span></div></section><section class="panel"><div class="score"><div><span class="pill">🟠 Bot</span><div class="big"><span id="scoreB">0</span> pts</div><div class="tiny"><span id="cardsB">0</span> cartes points · <span id="tokensB">5</span> jetons</div></div><span id="firstB" class="pill"></span></div></section></div><div id="status" class="status"></div><section class="panel"><h2 class="title">Votre main — cartes cibles</h2><div id="hand" class="hand-slots"></div></section><section class="panel"><h2 class="title">Rivière — cartes cibles</h2><div id="market" class="cards"></div></section><section class="panel"><h2 class="title">Cartes points</h2><div class="rows"><div class="row"><div class="label">Mode simple</div><div id="simple" class="points"></div></div><div class="row"><div class="label">Mode double</div><div id="double" class="points"></div></div><div class="row"><div class="label">Mode triple</div><div id="triple" class="points"></div></div></div><div class="actions"><button id="roll" style="display:none">🎲 Lancer le dé</button><span id="dieResult" class="pill" style="display:none"></span><button id="finish" class="light" style="display:none">Terminer mon tour</button></div></section><section class="panel"><h2 class="title">Journal</h2><div id="log" class="log"></div></section></div><script>const classic=[[5,12,20,'circle','orange'],[18,1,4,'circle','red'],[20,5,1,'circle','blue'],[19,3,7,'circle','red'],[1,20,18,'circle','orange'],[3,17,19,'circle','orange'],[8,16,11,'square','red'],[14,11,9,'triangle','orange'],[10,6,15,'triangle','blue'],[9,14,12,'triangle','red'],[12,9,5,'triangle','blue'],[17,2,3,'square','blue'],[13,4,6,'square','orange'],[16,7,8,'square','orange'],[15,10,2,'triangle','orange'],[6,13,10,'square','red'],[7,19,16,'square','blue'],[4,18,13,'square','blue'],[2,15,17,'triangle','red'],[11,8,14,'triangle','blue']].map((a,i)=>({id:'c'+i,type:'classic',mid:a[0],left:a[1],right:a[2],shape:a[3],color:a[4]}));const special=[{id:'25a',type:'25',shape:'circle',color:'red'},{id:'25b',type:'25',shape:'triangle',color:'orange'},{id:'miss',type:'miss',shape:'square',color:'red'},{id:'choice',type:'choice',shape:'circle',color:'blue'},{id:'ex1',type:'extra',values:[5,20,12,9,14,11,8],shape:'square',color:'orange'},{id:'ex2',type:'extra',values:[7,16,19,3,17,2,15],shape:'circle',color:'blue'},{id:'ex3',type:'extra',values:[10,25,6,13,4,18,1],shape:'triangle',color:'red'}];let G={};function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}function addLog(t){let e=document.getElementById('log');e.innerHTML+='• '+t+'<br>';e.scrollTop=e.scrollHeight}function vals(c){if(c.type==='classic')return[c.left,c.mid,c.right];if(c.type==='25')return[25];if(c.type==='extra')return c.values;if(c.type==='choice')return Array.from({length:25},(_,i)=>i+1);return[]}function desc(c){if(c.type==='classic')return'carte '+c.mid;if(c.type==='25')return'carte 25';if(c.type==='miss')return'carte Manquée';if(c.type==='choice')return'Valeur au choix';return'carte extra'}function sum(a){return a.reduce((x,y)=>x+y,0)}function wait(ms){return new Promise(r=>setTimeout(r,ms))}async function flyToHand(source,targetIndex,bot=false){let r=source.getBoundingClientRect(),clone=source.cloneNode(true);clone.classList.add('fly');Object.assign(clone.style,{left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px'});document.body.appendChild(clone);await wait(20);if(bot){clone.style.left=(innerWidth/2-r.width/2)+'px';clone.style.top='-160px'}else{let slot=document.querySelector('#hand .hand-slot[data-slot="'+targetIndex+'"]');if(slot){let t=slot.getBoundingClientRect();clone.style.left=t.left+'px';clone.style.top=t.top+'px';clone.style.width=t.width+'px';clone.style.height=t.height+'px'}}clone.style.opacity='.18';await wait(1380);clone.remove()}function symbol(c){return'<div class="sym '+c.shape+' '+c.color+'"></div>'}function cardHtml(c,state=''){let b='';if(c.type==='classic')b='<div class="mainv">'+c.mid+'</div><div class="dice">🎲</div><div class="sides"><span>'+c.left+'</span><span>'+c.right+'</span></div>';else if(c.type==='25')b='<div class="mainv">25</div><div class="dice">🎲</div>';else if(c.type==='miss')b='<div class="special">Manquée</div>';else if(c.type==='choice')b='<div class="special">Valeur<br>au choix</div>';else b='<div class="extras">'+c.values.map(v=>'<span>'+v+'</span>').join('')+'</div>';return'<div class="target '+state+'" data-id="'+c.id+'"><div class="symzone">'+symbol(c)+'</div><div class="body">'+b+'</div></div>'}function fill(){while(G.market.length<4&&G.deck.length)G.market.push(G.deck.shift())}function remaining(){return G.rows.simple.length+G.rows.double.length+G.rows.triple.length}function newGame(){let p=shuffle([...Array(20)].map((_,i)=>i+1).concat([25]));G={deck:shuffle([...classic,...special]),market:[],rows:{simple:p.slice(0,7),double:p.slice(7,14),triple:p.slice(14,21)},tt:{},H:{hand:[],used:new Set(),points:[],tokens:5},B:{hand:[],used:new Set(),points:[],tokens:5},phase:'pick',turn:'H',first:'H',picks:{H:0,B:0},done:{H:false,B:false},die:null,over:false};fill();document.getElementById('log').innerHTML='';addLog('Nouvelle partie : vous êtes Premier joueur.');render()}function dieValue(c){return c.type==='classic'?c.mid:c.type==='25'?25:null}function direct(w,v){let P=G[w];return P.hand.filter(c=>!P.used.has(c.id)&&vals(c).includes(v))}function dieCards(w,v){let P=G[w];return P.hand.filter(c=>!P.used.has(c.id)&&dieValue(c)===v)}function possible(m,v,w='H'){let P=G[w],a=direct(w,v),d=w==='H'?G.die:null;if(m==='simple')return a.length&&G.rows.simple[0]===v;if(m==='double')return a.length>=2||(d===2&&dieCards(w,v).length);if(m==='triple'){let t=G.tt[v]||{H:0,B:0},missing=3-t[w];return(a.length&&P.tokens>0)||(d&&dieCards(w,v).length&&P.tokens>=d&&d<=missing)}return false}function anyMove(w){return['simple','double','triple'].some(m=>G.rows[m].some(v=>possible(m,v,w)))}function render(){scoreH.textContent=sum(G.H.points);scoreB.textContent=sum(G.B.points);cardsH.textContent=G.H.points.length;cardsB.textContent=G.B.points.length;tokensH.textContent=G.H.tokens;tokensB.textContent=G.B.tokens;firstH.textContent=G.first==='H'?'⭐ Premier':'';firstB.textContent=G.first==='B'?'⭐ Premier':'';let pickable=G.phase==='pick'&&G.turn==='H';market.innerHTML=G.market.map(c=>cardHtml(c,pickable?'':'off')).join('');if(pickable)document.querySelectorAll('#market .target').forEach(e=>e.onclick=()=>humanPick(e.dataset.id));hand.innerHTML=[0,1,2].map(i=>{let c=G.H.hand[i];return'<div class="hand-slot '+(c?'filled':'')+'" data-slot="'+i+'">'+(c?cardHtml(c,G.H.used.has(c.id)?'used':''):'')+'</div>'}).join('');['simple','double','triple'].forEach(m=>{let box=document.getElementById(m);box.innerHTML=G.rows[m].map(v=>{let ok=G.phase==='play'&&G.turn==='H'&&possible(m,v),t=G.tt[v]||{H:0,B:0},ts=m==='triple'?'<div class="tokens">'+'<i class="tok me"></i>'.repeat(t.H)+'<i class="tok bot"></i>'.repeat(t.B)+'</div>':'';return'<div class="point '+(ok?'ok':'no')+'" data-mode="'+m+'" data-v="'+v+'">'+v+ts+'</div>'}).join('')});if(G.phase==='play'&&G.turn==='H')document.querySelectorAll('.point.ok').forEach(e=>e.onclick=()=>humanPlay(e.dataset.mode,+e.dataset.v));finish.style.display=G.phase==='play'&&G.turn==='H'?'inline-block':'none';if(G.phase==='play'&&G.turn==='H')finish.disabled=anyMove('H');roll.style.display=G.phase==='play'&&G.turn==='H'?'inline-block':'none';dieResult.style.display=G.phase==='play'&&G.turn==='H'&&G.die!=null?'inline-block':'none';dieResult.textContent=G.die!=null?'Résultat : '+G.die:'';status.textContent=G.over?'Partie terminée.':G.phase==='pick'?(G.turn==='H'?'Phase 1 — choisissez une carte cible ('+G.picks.H+'/3).':'Phase 1 — le bot choisit…'):G.phase==='transition'?'Phase 1 terminée — passage à la phase 2…':G.turn==='H'?'Phase 2 — jouez vos cartes cibles pour récupérer des cartes points.':'Phase 2 — le bot joue…'}async function humanPick(id){if(G.phase!=='pick'||G.turn!=='H')return;let i=G.market.findIndex(c=>c.id===id),source=document.querySelector('#market .target[data-id="'+id+'"]'),idx=G.H.hand.length;G.turn='LOCK';if(source)await flyToHand(source,idx);let c=G.market.splice(i,1)[0];G.H.hand.push(c);G.picks.H++;fill();addLog('Vous prenez '+desc(c)+'.');if(G.picks.H>=3&&G.picks.B>=3)return startPlay();G.turn='B';render();setTimeout(botPick,650)}async function botPick(){if(G.phase!=='pick'||G.turn!=='B')return;let ranked=G.market.map(c=>({c,score:vals(c).reduce((s,v)=>s+(G.rows.simple.includes(v)||G.rows.double.includes(v)||G.rows.triple.includes(v)?v:0),0)+Math.random()*5})).sort((a,b)=>b.score-a.score),c=ranked[0].c,i=G.market.findIndex(x=>x.id===c.id),source=document.querySelector('#market .target[data-id="'+c.id+'"]');G.turn='LOCK';if(source)await flyToHand(source,0,true);G.B.hand.push(G.market.splice(i,1)[0]);G.picks.B++;fill();addLog('Le bot prend une carte cible.');if(G.picks.H>=3&&G.picks.B>=3)return startPlay();G.turn='H';render()}function startPlay(){G.phase='transition';G.turn='LOCK';render();setTimeout(()=>{G.phase='play';G.done={H:false,B:false};G.die=null;if(G.H.hand.some(c=>c.type==='miss'))G.turn='H';else if(G.B.hand.some(c=>c.type==='miss'))G.turn='B';else G.turn=G.first;addLog((G.H.hand.some(c=>c.type==='miss')?'Vous':G.B.hand.some(c=>c.type==='miss')?'Le bot':G.first==='H'?'Vous':'Le bot')+' commence la phase 2.');render();document.querySelector('#simple').closest('.panel').scrollIntoView({behavior:'smooth'});if(G.turn==='B')setTimeout(botPlay,500)},900)}function takePoint(w,m,v){let row=G.rows[m],i=row.indexOf(v);if(i<0)return;row.splice(i,1);G[w].points.push(v);addLog((w==='H'?'Vous récupérez ':'Le bot récupère ')+v+' en mode '+m+'.')}function humanPlay(m,v){if(!possible(m,v))return;let a=direct('H',v),d=dieCards('H',v);if(m==='simple'){G.H.used.add(a[0].id);takePoint('H',m,v)}if(m==='double'){if(G.die===2&&d.length&&a.length<2){G.H.used.add(d[0].id);G.die=null;takePoint('H',m,v)}else{G.H.used.add(a[0].id);G.H.used.add(a[1].id);takePoint('H',m,v)}}if(m==='triple'){let t=G.tt[v]||{H:0,B:0},missing=3-t.H;if(G.die&&d.length&&G.die<=missing&&G.H.tokens>=G.die){let n=G.die;G.H.used.add(d[0].id);t.H+=n;G.H.tokens-=n;G.die=null;G.tt[v]=t;addLog('Vous posez '+n+' jeton(s) sur '+v+' grâce au dé.')}else{G.H.used.add(a[0].id);t.H++;G.H.tokens--;G.tt[v]=t;addLog('Vous posez un jeton sur '+v+'.')}if(t.H>=3){takePoint('H',m,v);G.H.tokens+=t.H;G.B.tokens+=t.B;delete G.tt[v]}}render();if(!anyMove('H'))finishHuman()}function nextPhase2(w){G.done[w]=true;G.die=null;let other=w==='H'?'B':'H';if(!G.done[other]){G.turn=other;render();if(other==='B')setTimeout(botPlay,500);return}endRound()}function finishHuman(){nextPhase2('H')}finish.onclick=()=>{if(!anyMove('H'))finishHuman()};roll.onclick=()=>{if(G.phase!=='play'||G.turn!=='H')return;let faces=[1,1,1,2,2,3];G.die=faces[Math.floor(Math.random()*faces.length)];addLog('Vous lancez le dé : '+G.die+'.');render()};function botPlay(){while(anyMove('B')){let o=[];['simple','double','triple'].forEach(m=>G.rows[m].forEach(v=>{if(possible(m,v,'B'))o.push({m,v})}));o.sort((a,b)=>b.v-a.v);let x=o[0],a=direct('B',x.v);if(x.m==='simple'){G.B.used.add(a[0].id);takePoint('B',x.m,x.v)}if(x.m==='double'){G.B.used.add(a[0].id);G.B.used.add(a[1].id);takePoint('B',x.m,x.v)}if(x.m==='triple'){G.B.used.add(a[0].id);let t=G.tt[x.v]||{H:0,B:0};t.B++;G.B.tokens--;G.tt[x.v]=t;if(t.B>=3){takePoint('B',x.m,x.v);G.H.tokens+=t.H;G.B.tokens+=t.B;delete G.tt[x.v]}}}addLog('Le bot termine son tour.');nextPhase2('B')}function endRound(){if(remaining()<=7)return endGame();let mi=G.market.findIndex(c=>c.type==='miss');if(mi>=0){G.market.splice(mi,1);fill();addLog('Personne n’a pris la carte Manquée : elle est défaussée.')}G.first=G.first==='H'?'B':'H';G.H.hand=[];G.B.hand=[];G.H.used=new Set();G.B.used=new Set();G.picks={H:0,B:0};G.done={H:false,B:false};G.die=null;G.phase='pick';G.turn=G.first;addLog('Le pion Premier joueur passe : '+(G.first==='H'?'vous êtes Premier joueur.':'le bot est Premier joueur.'));render();if(G.turn==='B')setTimeout(botPick,500)}function endGame(){[...G.rows.triple].forEach(v=>{let t=G.tt[v]||{H:0,B:0};if(t.H>t.B)takePoint('H','triple',v);else if(t.B>t.H)takePoint('B','triple',v)});G.over=true;render();let h=sum(G.H.points),b=sum(G.B.points);status.textContent=h>b?'Vous gagnez '+h+' à '+b+' !':b>h?'Le bot gagne '+b+' à '+h+'.':'Égalité de points.'}restart.onclick=newGame;newGame();</script></body></html>
