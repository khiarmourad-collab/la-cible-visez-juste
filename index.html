<style>
:root{--bg:#f4f2ee;--ink:#171717;--card:#fff;--violet:#c56ad8;--blue:#2f7df4;--orange:#f59b45}
*{box-sizing:border-box} body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink)}
header{position:sticky;top:0;z-index:20;background:#151515;color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}

.status{background:#fff1bd;border:2px solid #e8c959;border-radius:14px;padding:11px 13px;font-weight:800;margin-bottom:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.panel{background:#fff;border-radius:16px;padding:13px;box-shadow:0 7px 24px rgba(0,0,0,.09);margin-bottom:13px}.score{display:flex;justify-content:space-between}.pill{padding:5px 9px;border-radius:999px;background:#eee;font-weight:800;font-size:13px}.big{font-size:28px;font-weight:900}.tiny{font-size:12px;color:#666}.title{font-weight:900;margin:0 0 9px;font-size:16px}.cards{display:flex;gap:9px;flex-wrap:wrap}.target{width:128px;height:178px;border:4px solid #171717;border-radius:5px;background:#fff;overflow:hidden;cursor:pointer}.target.off{opacity:.4}.target.used{opacity:.25}.symzone{height:42px;border-bottom:3px solid #171717;display:flex;align-items:center;justify-content:center}.sym{width:25px;height:25px}.circle{border-radius:50%}.square{border-radius:2px}.red{background:#ff3232;color:#ff3232}.blue{background:#1717dc;color:#1717dc}.orange{background:#ff9651;color:#ff9651}.triangle{width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-bottom:25px solid currentColor;background:none!important}.body{height:132px;padding:7px}.mainv{text-align:center;font-size:37px;font-weight:900;font-style:italic}.dice{text-align:center}.sides{display:flex;justify-content:space-between;font-size:26px;font-weight:900;font-style:italic;margin-top:17px}.special{height:118px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:22px;font-weight:900}.extras{display:grid;grid-template-columns:1fr 1fr;font-size:22px;font-weight:900;text-align:center}.rows{display:grid;gap:9px}.row{display:grid;grid-template-columns:100px 1fr;gap:8px;align-items:center}.label{background:var(--violet);border:3px solid #171717;border-radius:5px;padding:10px 5px;text-align:center;font-weight:900}.points{display:flex;gap:7px;overflow:auto}.point{min-width:64px;height:66px;border:3px solid #171717;border-radius:5px;background:#fff;font-size:27px;font-weight:900;display:flex;align-items:center;justify-content:center;position:relative}.point.no{opacity:.38}.point.ok{outline:4px solid #51b66b}.tokens{position:absolute;bottom:2px;display:flex;gap:2px}.tok{width:9px;height:9px;border-radius:50%;border:1px solid #111}.me{background:var(--blue)}.bot{background:var(--orange)}.actions{margin-top:10px}.log{background:#151515;color:#eee;border-radius:10px;padding:9px;max-height:170px;overflow:auto;font-size:12px}.fly{position:fixed;z-index:9999;pointer-events:none;transition:left .72s cubic-bezier(.2,.8,.2,1),top .72s cubic-bezier(.2,.8,.2,1),transform .72s ease,opacity .72s ease}
@media(max-width:650px){.wrap{padding:8px}.grid2{gap:6px}.panel{padding:9px;margin-bottom:8px}.big{font-size:21px}.tiny{font-size:10px}.cards{gap:6px;flex-wrap:nowrap;overflow-x:auto}.target{flex:0 0 96px;width:96px;height:auto;aspect-ratio:63/88}.row{grid-template-columns:58px 1fr;gap:4px}.label{font-size:10px;padding:7px 2px}.points{gap:3px;overflow:visible}.point{min-width:0;width:calc((100% - 18px)/7);height:48px;font-size:18px}.tok{width:6px;height:6px}.status{position:sticky;top:58px;z-index:19}}
</style></head><body><header><div><h1>🎯 La cible, visez juste !</h1><div class="sub">Preview recodée</div></div><button id="restart">Nouvelle partie</button></header><div class="wrap"><div class="grid2"><section class="panel"><div class="score"><div><span class="pill">🔵 Vous</span><div class="big"><span id="scoreH">0</span> pts</div><div class="tiny"><span id="cardsH">0</span> cartes · <span id="tokensH">5</span> jetons</div></div></div></section><section class="panel"><div class="score"><div><span class="pill">🟠 Bot</span><div class="big"><span id="scoreB">0</span> pts</div><div class="tiny"><span id="cardsB">0</span> cartes · <span id="tokensB">5</span> jetons</div></div></div></section></div><div id="status" class="status">Initialisation…</div><section class="panel"><h2 class="title">Votre main</h2><div id="hand" class="cards"></div></section><section class="panel"><h2 class="title">Rivière — cartes cibles</h2><div id="market" class="cards"></div></section><section class="panel"><h2 class="title">Cartes points</h2><div class="rows"><div class="row"><div class="label">Simple</div><div id="simple" class="points"></div></div><div class="row"><div class="label">Double</div><div id="double" class="points"></div></div><div class="row"><div class="label">Triple</div><div id="triple" class="points"></div></div></div><div class="actions"><button id="finish" style="display:none">Terminer mon tour</button></div></section><section class="panel"><h2 class="title">Journal</h2><div id="log" class="log"></div></section></div><script>
const classic=[[5,12,20,'circle','orange'],[18,1,4,'circle','red'],[20,5,1,'circle','blue'],[19,3,7,'circle','red'],[1,20,18,'circle','orange'],[3,17,19,'circle','orange'],[8,16,11,'square','red'],[14,11,9,'triangle','orange'],[10,6,15,'triangle','blue'],[9,14,12,'triangle','red'],[12,9,5,'triangle','blue'],[17,2,3,'square','blue'],[13,4,6,'square','orange'],[16,7,8,'square','orange'],[15,10,2,'triangle','orange'],[6,13,10,'square','red'],[7,19,16,'square','blue'],[4,18,13,'square','blue'],[2,15,17,'triangle','red'],[11,8,14,'triangle','blue']].map((a,i)=>({id:'c'+i,type:'classic',mid:a[0],left:a[1],right:a[2],shape:a[3],color:a[4]}));const special=[{id:'25a',type:'25',shape:'circle',color:'red'},{id:'25b',type:'25',shape:'triangle',color:'orange'},{id:'miss',type:'miss',shape:'square',color:'red'},{id:'choice',type:'choice',shape:'circle',color:'blue'},{id:'ex1',type:'extra',values:[5,20,12,9,14,11,8],shape:'square',color:'orange'},{id:'ex2',type:'extra',values:[7,16,19,3,17,2,15],shape:'circle',color:'blue'},{id:'ex3',type:'extra',values:[10,25,6,13,4,18,1],shape:'triangle',color:'red'}];let G={};const shuffle=a=>{a=[...a];for(let i=a.length-1;i;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a},sum=a=>a.reduce((x,y)=>x+y,0),wait=m=>new Promise(r=>setTimeout(r,m));function vals(c){if(c.type==='classic')return[c.left,c.mid,c.right];if(c.type==='25')return[25];if(c.type==='extra')return c.values;if(c.type==='choice')return Array.from({length:25},(_,i)=>i+1);return[]}function desc(c){return c.type==='classic'?`carte ${c.mid}`:c.type==='25'?'carte 25':c.type==='miss'?'Manquée':c.type==='choice'?'Valeur au choix':'Extra'}function log(t){let e=document.getElementById('log');e.innerHTML+='• '+t+'<br>';e.scrollTop=e.scrollHeight}function symbol(c){return`<div class="sym ${c.shape} ${c.color}"></div>`}function card(c,state=''){let b=c.type==='classic'?`<div class="mainv">${c.mid}</div><div class="dice">🎲</div><div class="sides"><span>${c.left}</span><span>${c.right}</span></div>`:c.type==='25'?'<div class="mainv">25</div><div class="dice">🎲</div>':c.type==='miss'?'<div class="special">Manquée</div>':c.type==='choice'?'<div class="special">Valeur<br>au choix</div>':`<div class="extras">${c.values.map(v=>`<span>${v}</span>`).join('')}</div>`;return`<div class="target ${state}" data-id="${c.id}"><div class="symzone">${symbol(c)}</div><div class="body">${b}</div></div>`}function fill(){while(G.market.length<4&&G.deck.length)G.market.push(G.deck.shift())}function newGame(){let p=shuffle([...Array(20)].map((_,i)=>i+1).concat(25));G={deck:shuffle([...classic,...special]),market:[],rows:{simple:p.slice(0,7),double:p.slice(7,14),triple:p.slice(14)},tt:{},H:{hand:[],used:new Set(),points:[],tokens:5},B:{hand:[],used:new Set(),points:[],tokens:5},phase:'pick',turn:'H',picks:{H:0,B:0}};fill();document.getElementById('log').innerHTML='';log('Nouvelle partie.');render()}function possible(m,v,w){let a=G[w].hand.filter(c=>!G[w].used.has(c.id)&&vals(c).includes(v));if(m==='simple')return a.length&&G.rows.simple[0]===v;if(m==='double')return a.length>=2;if(m==='triple')return a.length&&G[w].tokens>0}function any(w){return['simple','double','triple'].some(m=>G.rows[m].some(v=>possible(m,v,w)))}function render(){scoreH.textContent=sum(G.H.points);scoreB.textContent=sum(G.B.points);cardsH.textContent=G.H.points.length;cardsB.textContent=G.B.points.length;tokensH.textContent=G.H.tokens;tokensB.textContent=G.B.tokens;hand.innerHTML=G.H.hand.map(c=>card(c,G.H.used.has(c.id)?'used':'')).join('');market.innerHTML=G.market.map(c=>card(c,G.phase==='pick'&&G.turn==='H'?'':'off')).join('');if(G.phase==='pick'&&G.turn==='H')document.querySelectorAll('#market .target').forEach(e=>e.onclick=()=>pickH(e));['simple','double','triple'].forEach(m=>{let b=document.getElementById(m);b.innerHTML=G.rows[m].map(v=>`<div class="point ${G.phase==='play'&&G.turn==='H'&&possible(m,v,'H')?'ok':'no'}" data-m="${m}" data-v="${v}">${v}</div>`).join('')});document.querySelectorAll('.point.ok').forEach(e=>e.onclick=()=>playH(e.dataset.m,+e.dataset.v));finish.style.display=G.phase==='play'&&G.turn==='H'?'inline-block':'none';finish.disabled=any('H');status.textContent=G.phase==='pick'?(G.turn==='H'?`Phase 1 — choisissez une carte (${G.picks.H}/3).`:'Le bot choisit…'):(G.turn==='H'?'Phase 2 — jouez une carte point en vert.':'Le bot joue…')}async function fly(el,idx,bot){let r=el.getBoundingClientRect(),c=el.cloneNode(true);c.classList.add('fly');Object.assign(c.style,{left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px'});document.body.appendChild(c);await wait(20);if(bot){c.style.top='-160px';c.style.left=innerWidth/2+'px'}else{let h=hand.getBoundingClientRect(),w=innerWidth<=650?96:128,g=innerWidth<=650?6:9;c.style.left=h.left+idx*(w+g)+'px';c.style.top=h.top+'px'}c.style.opacity=.1;c.style.transform='scale(.75)';await wait(730);c.remove()}async function pickH(el){let id=el.dataset.id,i=G.market.findIndex(c=>c.id===id),idx=G.H.hand.length;G.turn='LOCK';await fly(el,idx,false);let c=G.market.splice(i,1)[0];G.H.hand.push(c);G.picks.H++;fill();log('Vous prenez '+desc(c)+'.');if(G.picks.H>=3&&G.picks.B>=3)return start();G.turn='B';render();setTimeout(pickB,300)}async function pickB(){let i=Math.floor(Math.random()*G.market.length),el=market.children[i];G.turn='LOCK';if(el)await fly(el,0,true);G.B.hand.push(G.market.splice(i,1)[0]);G.picks.B++;fill();log('Le bot prend une carte.');if(G.picks.H>=3&&G.picks.B>=3)return start();G.turn='H';render()}function start(){G.phase='play';G.turn=G.H.hand.some(c=>c.type==='miss')?'H':G.B.hand.some(c=>c.type==='miss')?'B':'H';render();if(G.turn==='B')setTimeout(bot,300)}function take(w,m,v){let i=G.rows[m].indexOf(v);G.rows[m].splice(i,1);G[w].points.push(v);log((w==='H'?'Vous récupérez ':'Le bot récupère ')+v+'.')}function playH(m,v){let a=G.H.hand.filter(c=>!G.H.used.has(c.id)&&vals(c).includes(v));if(m==='simple'){G.H.used.add(a[0].id);take('H',m,v)}else if(m==='double'){G.H.used.add(a[0].id);G.H.used.add(a[1].id);take('H',m,v)}else{G.H.used.add(a[0].id);G.H.tokens--;let t=G.tt[v]||{H:0,B:0};t.H++;G.tt[v]=t;if(t.H>=3)take('H',m,v)}render()}finish.onclick=()=>{if(!any('H')){G.turn='B';render();setTimeout(bot,300)}};function bot(){let guard=0;while(any('B')&&guard++<20){let o=[];['simple','double','triple'].forEach(m=>G.rows[m].forEach(v=>possible(m,v,'B')&&o.push({m,v})));o.sort((a,b)=>b.v-a.v);let x=o[0],a=G.B.hand.filter(c=>!G.B.used.has(c.id)&&vals(c).includes(x.v));if(x.m==='simple'){G.B.used.add(a[0].id);take('B',x.m,x.v)}else if(x.m==='double'){G.B.used.add(a[0].id);G.B.used.add(a[1].id);take('B',x.m,x.v)}else{G.B.used.add(a[0].id);G.B.tokens--;let t=G.tt[x.v]||{H:0,B:0};t.B++;G.tt[x.v]=t;if(t.B>=3)take('B',x.m,x.v)}}G.H.hand=[];G.B.hand=[];G.H.used=new Set();G.B.used=new Set();G.picks={H:0,B:0};G.phase='pick';G.turn='H';render()}restart.onclick=newGame;newGame();
</script></body></html>
